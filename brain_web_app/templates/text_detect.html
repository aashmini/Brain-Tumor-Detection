<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Detection | NeuroScan</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f8fa;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #2b2e4a;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: bold;
      color: #444;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
      background-color: #fafafa;
    }

    button {
      margin-top: 30px;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      border: none;
      background-color: #4a60ff;
      color: white;
      border-radius: 25px;
      cursor: pointer;
    }

    button:hover {
      background-color: #384ed1;
    }

    .result {
  margin-top: 30px;
  padding: 20px;
  border-left: 6px solid;
  border-radius: 12px;
  font-size: 1.1rem;
  box-shadow: 0 0 12px rgba(0, 0, 0, 0.05);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.result.positive {
  background-color: #ffe6e6;
  border-color: #e63946;
  color: #b20e10;
}

.result.negative {
  background-color: #e6ffe6;
  border-color: #38a169;
  color: #276749;
}


    .back-button {
      display: block;
      text-align: center;
      margin-top: 30px;
      text-decoration: none;
      color: #4a60ff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <a href="{{ url_for('home') }}" class="back-button">Home</a>
  <div class="container">
    <h1>Brain Tumor Prediction</h1>
    <form method="POST">
      <label for="age">Age:</label>
      <input type="text" name="age" id="age" required>

      <label for="gender">Gender:</label>
      <select name="gender" id="gender" required>
        <option value="">-- Select Gender --</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label for="family_history">Family History of Brain Tumor?</label>
      <select name="family_history" id="family_history" required>
        <option value="">-- Select Option --</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <label for="symptoms">Symptoms (comma-separated):</label>
      <input type="text" name="symptoms" id="symptoms" required>

      <label for="medical_history">Medical History:</label>
      <input type="text" name="medical_history" id="medical_history" required>

      <button type="submit">Predict</button>
    </form>

    {% if prediction %}
<div class="result {{ status }}">
  <h3>Prediction Result:</h3>
  <p>{{ prediction }}</p>
</div>
{% endif %}


    
  </div>
</body>
</html>
